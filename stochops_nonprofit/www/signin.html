<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دخول الجمعيات | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0b1220;--bg2:#0e1a2e;--panel:#16223a;--line:#223150;--ink:#eaf0f8;--muted:#9db0c8;--brand:#3d6ef5;--accent:#f2922e}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%}
    body{background:linear-gradient(160deg,#0b1220,#0e1a2e 70%,#13213c);color:var(--ink);font-family:'Tajawal',system-ui,Tahoma,sans-serif;display:flex;flex-direction:column;min-height:100vh}
    a{color:inherit;text-decoration:none}
    .top{max-width:1100px;width:100%;margin:0 auto;padding:22px 20px;display:flex;justify-content:space-between;align-items:center}
    .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;direction:ltr}
    .logo b{color:var(--ink)} .logo span{color:var(--accent)}
    .logo .mark{display:inline-flex;gap:3px;align-items:flex-end}
    .logo .mark i{width:5px;border-radius:2px;display:block;background:var(--brand)}
    .logo .mark i:nth-child(1){height:12px}.logo .mark i:nth-child(2){height:18px}.logo .mark i:nth-child(3){height:24px;background:var(--accent)}
    .top .back{color:var(--muted);font-weight:500}
    .top .back:hover{color:var(--ink)}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px 34px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .card h1{font-size:30px;font-weight:800;margin:0 0 6px;text-align:center}
    .card .sub{color:var(--muted);text-align:center;margin:0 0 28px;font-size:16px}
    label{display:block;font-size:15px;font-weight:600;margin:0 0 8px}
    .field{margin-bottom:18px}
    input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);font-family:inherit;font-size:16px}
    input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,110,245,.25)}
    .btn{width:100%;background:var(--accent);color:#1a1200;border:none;border-radius:12px;padding:15px;font-family:inherit;font-size:18px;font-weight:800;cursor:pointer;margin-top:6px}
    .btn:hover{background:#e07f1c}
    .btn:disabled{opacity:.6;cursor:default}
    .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
    .row a{color:var(--brand);font-size:14px;font-weight:600}
    .msg{display:none;background:#3a1f1d;border:1px solid #ef6f66;color:#ffd9d4;border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:18px}
    .msg.show{display:block}
    .hint{text-align:center;color:var(--muted);font-size:14px;margin-top:22px;line-height:1.7}
    .hint a{color:var(--brand);font-weight:600}
    footer{color:#6f7f95;font-size:13px;text-align:center;padding:24px 20px;line-height:1.6}
  </style>
</head>
<body>
  <div class="top">
    <a class="logo" href="/"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
    <a class="back" href="/">← الرئيسية</a>
  </div>
  <main>
    <form class="card" id="signin" autocomplete="on">
      <h1>دخول الجمعيات</h1>
      <p class="sub">سجّلوا الدخول إلى مساحة عمل جمعيتكم في منصة الفاضل.</p>
      <div class="msg" id="msg"></div>
      <div class="field">
        <label for="usr">البريد الإلكتروني</label>
        <input type="email" id="usr" name="usr" dir="ltr" placeholder="name@example.com" required />
      </div>
      <div class="field">
        <label for="pwd">كلمة المرور</label>
        <input type="password" id="pwd" name="pwd" dir="ltr" placeholder="••••••••" required />
      </div>
      <div class="row">
        <span></span>
        <a href="/login#forgot">نسيت كلمة المرور؟</a>
      </div>
      <button class="btn" id="btn" type="submit">دخول</button>
      <p class="hint">ليس لدى جمعيتكم حساب بعد؟ <a href="/apply">قدّموا طلب استفادة</a></p>
    </form>
  </main>
  <footer>منصة الفاضل — منتج STOCHOPS · الدخول آمن ومشفّر.</footer>

  <script>
    (function(){
      var form=document.getElementById('signin'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
      function qp(k){try{return new URLSearchParams(location.search).get(k)}catch(e){return null}}
      var dest=qp('redirect-to')||'/nos/console';
      // لا نسمح إلا بمسار داخلي يبدأ بـ "/" مفرد (نرفض // و /\ لمنع إعادة التوجيه الخارجية)
      if(!/^\/[A-Za-z0-9/_\-]*$/.test(dest) || dest.charAt(1)==='/' || dest.charAt(1)==='\\') dest='/nos/console';
      function showErr(t){msg.textContent=t;msg.classList.add('show')}
      form.addEventListener('submit',function(e){
        e.preventDefault();
        msg.classList.remove('show');
        var usr=document.getElementById('usr').value.trim(),pwd=document.getElementById('pwd').value;
        if(!usr||!pwd){showErr('الرجاء إدخال البريد وكلمة المرور.');return}
        btn.disabled=true;btn.textContent='جارٍ الدخول…';
        fetch('/api/method/login',{
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'},
          body:new URLSearchParams({usr:usr,pwd:pwd})
        }).then(function(r){
          if(r.ok){window.location.href=dest;return}
          btn.disabled=false;btn.textContent='دخول';
          if(r.status===401){showErr('بيانات الدخول غير صحيحة. تحقّق من البريد وكلمة المرور.')}
          else if(r.status===417||r.status===429){showErr('محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.')}
          else{showErr('تعذّر تسجيل الدخول حاليًا. حاول مرة أخرى.')}
        }).catch(function(){
          btn.disabled=false;btn.textContent='دخول';
          showErr('تعذّر الاتصال. تحقّق من الشبكة وحاول مرة أخرى.')
        });
      });
    })();
  </script>
</body>
</html>
