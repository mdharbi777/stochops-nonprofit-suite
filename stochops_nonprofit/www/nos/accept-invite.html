<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تفعيل الدعوة | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(900px 500px at 80% -10%, #16233f 0%, transparent 60%); min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:20px; }
    .box { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:30px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; direction:ltr; justify-content:center; margin-bottom:8px; }
    .logo .mark { width:28px; height:28px; border-radius:8px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    h1 { color:#fff; font-size:21px; font-weight:800; text-align:center; margin:6px 0 4px; }
    .muted { color:var(--muted); font-size:13.5px; text-align:center; margin-bottom:16px; }
    label { display:block; font-size:13px; color:var(--text); margin:12px 0 6px; font-weight:500; }
    input { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px; padding:12px 13px; color:#fff; font-family:inherit; font-size:14px; }
    input:focus { outline:none; border-color:var(--blue); }
    .btn { width:100%; background:var(--blue); color:#fff; border:none; border-radius:999px; padding:12px; font-weight:700; font-size:15px; font-family:inherit; cursor:pointer; margin-top:18px; } .btn:hover{ background:#1d4ed8; } .btn:disabled{opacity:.6;}
    .msg { margin-top:14px; padding:11px 14px; border-radius:10px; font-size:14px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .msg.ok { display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4); color:var(--green); }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></div>
    <h1>تفعيل حسابك في منصة الفاضل</h1>
    <p class="muted">اضبط كلمة مرورك لإكمال الانضمام إلى فريق جمعيتك.</p>
    <div id="form">
      <label>كلمة المرور (8 أحرف فأكثر)</label>
      <input id="pass" type="password" autocomplete="new-password">
      <label>تأكيد كلمة المرور</label>
      <input id="pass2" type="password" autocomplete="new-password">
      <button class="btn" id="btn" onclick="submit()">تفعيل الحساب</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    function token(){ try { return new URLSearchParams(location.search).get("token")||""; } catch(e){ return ""; } }
    function show(type, text){ var m=document.getElementById("msg"); m.className="msg "+type; m.textContent=text; }
    function errMsg(j){
      try { var sm=JSON.parse(j._server_messages||"[]"); if(sm.length) return (JSON.parse(sm[0]).message||"").replace(/<[^>]+>/g,""); } catch(e){}
      return "تعذّر التفعيل — قد يكون الرابط منتهياً.";
    }
    if(!token()){ document.getElementById("form").style.display="none"; show("err","رابط الدعوة غير صالح."); }

    window.submit = function(){
      var p=document.getElementById("pass").value, p2=document.getElementById("pass2").value;
      if(p.length<8){ show("err","كلمة المرور يجب ألا تقل عن 8 أحرف."); return; }
      if(p!==p2){ show("err","كلمتا المرور غير متطابقتين."); return; }
      document.getElementById("btn").disabled=true;
      fetch("/api/method/stochops_nonprofit.accounts.accept_invite", {
        method:"POST", headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":CSRF},
        body: JSON.stringify({token:token(), password:p})
      }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
        .then(function(res){
          if(res.ok && res.j.message && res.j.message.activated){
            document.getElementById("form").style.display="none";
            show("ok","تم تفعيل حسابك. يمكنك الآن تسجيل الدخول.");
            setTimeout(function(){ location.href="/login?redirect-to=/nos/console"; }, 2000);
          } else { show("err", errMsg(res.j)); document.getElementById("btn").disabled=false; }
        }).catch(function(){ show("err","تعذّر الاتصال."); document.getElementById("btn").disabled=false; });
    };
  </script>
</body>
</html>
