{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المستفيدون | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/nos-crud.css?v=1" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/design-system.css?v=1" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=3" />
  <script>
    window.NOS_CSRF = "{{ frappe.session.csrf_token or '' }}";
    window.NOS_USER = "{{ frappe.session.user }}";
    window.NOS_LIST = {
      doctype:"Beneficiary", title:"المستفيدون",
      desc:"سجلّ المستفيدين — بيانات تعريف أدنى، معزولة بجمعيتك.",
      note:"رقم الهوية مُخزَّن مشفّراً ومحجوب؛ لا يظهر في القائمة. يُكشف من صفحة المستفيد لمدير الجمعية عند الحاجة فقط. لا تُخزَّن بيانات أفراد الأسرة تفصيلاً (عدد إجمالي فقط).",
      loginRedirect:"/nos/beneficiaries", detailRoute:"/nos/beneficiary",
      columns:[
        {field:"beneficiary_name", label:"الاسم", sortable:true},
        {field:"phone", label:"الجوال", hideSmall:true},
        {field:"gender", label:"الجنس", hideSmall:true},
        {field:"social_category", label:"الفئة"},
        {field:"family_members_count", label:"أفراد الأسرة"},
        {field:"status", label:"الحالة", sortable:true, badge:true}
      ],
      search:{ field:"beneficiary_name", placeholder:"بحث بالاسم..." },
      filters:[
        {field:"status", label:"كل الحالات", options:["نشط","مؤرشف"]},
        {field:"social_category", label:"كل الفئات", options:["أرملة","أيتام","دخل محدود","كبار السن","ذوو إعاقة","أخرى"]}
      ],
      defaultSort:"creation", addLabel:"مستفيد جديد",
      addFields:[
        {field:"beneficiary_name", label:"الاسم", type:"text", required:true},
        {field:"national_id", label:"رقم الهوية (اختياري، 10 أرقام)", type:"text", pattern:/^\d{10}$/, patternMsg:"رقم الهوية يجب أن يكون 10 أرقام."},
        {field:"phone", label:"الجوال", type:"text"},
        {field:"gender", label:"الجنس", type:"select", options:["ذكر","أنثى"]},
        {field:"social_category", label:"الفئة", type:"select", options:["أرملة","أيتام","دخل محدود","كبار السن","ذوو إعاقة","أخرى"]},
        {field:"family_members_count", label:"عدد أفراد الأسرة", type:"number", default:"0"}
      ]
    };
  </script>
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=4" defer></script>
  <script src="/assets/stochops_nonprofit/nos/nos-list.js?v=2" defer></script>
