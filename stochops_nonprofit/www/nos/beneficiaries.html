{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المستفيدون | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(1000px 500px at 85% -10%, #16233f 0%, transparent 60%); min-height:100vh; }
    a { color:var(--cyan); text-decoration:none; }
    .wrap { max-width:1040px; margin:0 auto; padding:0 20px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; direction:ltr; }
    .logo .mark { width:26px; height:26px; border-radius:7px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); }
    .topbar .right { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--muted); }
    h1 { color:#fff; font-size:26px; font-weight:800; margin:24px 0 2px; }
    .muted { color:var(--muted); font-size:14px; }
    .note { background:var(--navy2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--muted); margin:16px 0; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-top:18px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:right; padding:11px 10px; border-bottom:1px solid var(--border); font-size:13.5px; }
    th { color:var(--muted); font-weight:500; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; }
    .pill.on { background:rgba(34,197,94,.14); color:var(--green); } .pill.off { background:rgba(148,163,184,.15); color:var(--muted); }
    label { display:block; font-size:13px; color:var(--text); margin:12px 0 6px; font-weight:500; }
    input, select { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:#fff; font-family:inherit; font-size:14px; }
    input:focus, select:focus { outline:none; border-color:var(--blue); }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .btn { background:var(--blue); color:#fff; border:none; border-radius:999px; padding:10px 20px; font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; } .btn:hover{ background:#1d4ed8; } .btn:disabled{opacity:.6;}
    .btn-sm { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 12px; font-size:13px; font-family:inherit; cursor:pointer; } .btn-sm:hover{ border-color:var(--cyan); }
    .msg { margin-top:14px; padding:11px 14px; border-radius:10px; font-size:14px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .msg.ok { display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4); color:var(--green); }
    .center { text-align:center; padding:60px 0; }
    .mono { font-variant-numeric:tabular-nums; letter-spacing:1px; }
    @media (max-width:720px){ .grid3{ grid-template-columns:1fr; } th:nth-child(2),td:nth-child(2){display:none;} }
  </style>
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/design-system.css?v=1" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=3" />
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=3" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/nos"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
      <div class="right">
        <a href="/nos/console">لوحة التشغيل</a>
        <a href="/nos/assistance">طلبات المساعدة</a>
        <span id="whoami"></span>
        <a href="/api/method/logout">خروج</a>
      </div>
    </div>
    <div id="app"></div>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    var USER = "{{ frappe.session.user }}";
    var app = document.getElementById("app");
    document.getElementById("whoami").textContent = (USER && USER!=="Guest") ? USER : "";

    function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
    function api(method, args, isPost){
      var opt = { headers: { "X-Frappe-CSRF-Token": CSRF } };
      var url = "/api/method/" + method;
      if (isPost){ opt.method="POST"; opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(args||{}); }
      else if (args){ url += "?" + new URLSearchParams(args).toString(); }
      return fetch(url, opt).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
    }
    function errMsg(res){
      try { var sm=JSON.parse(res.j._server_messages||"[]"); if(sm.length) return (JSON.parse(sm[0]).message||"").replace(/<[^>]+>/g,""); } catch(e){}
      return "حدث خطأ.";
    }

    if (!USER || USER==="Guest"){
      app.innerHTML = '<div class="center"><h1>المستفيدون</h1><p class="muted">يجب تسجيل الدخول.</p><p style="margin-top:16px"><a class="btn" href="/login?redirect-to=/nos/console">تسجيل الدخول</a></p></div>';
    } else { render(); }

    function render(){
      var args = { doctype:"Beneficiary", fields:JSON.stringify(["name","beneficiary_name","phone","gender","social_category","family_members_count","status"]),
        order_by:"creation desc", limit_page_length:0 };
      api("frappe.client.get_list", args).then(function(res){
        if (!res.ok){ app.innerHTML = '<div class="center"><h1>المستفيدون</h1><p class="msg err" style="display:block">'+esc(errMsg(res))+'</p></div>'; return; }
        var rows = (res.j.message||[]).map(function(b){
          var st = b.status==="نشط" ? '<span class="pill on">نشط</span>' : '<span class="pill off">مؤرشف</span>';
          return '<tr><td>'+esc(b.beneficiary_name)+'</td><td>'+esc(b.phone||"—")+'</td><td>'+esc(b.gender||"—")+'</td>'+
            '<td>'+esc(b.social_category||"—")+'</td><td>'+esc(String(b.family_members_count||0))+'</td><td>'+st+'</td>'+
            '<td><button class="btn-sm" onclick="reveal(\''+esc(b.name)+'\',this)">كشف الهوية</button></td></tr>';
        }).join("");
        app.innerHTML =
          '<h1>المستفيدون</h1>'+
          '<p class="muted">سجلّ المستفيدين — بيانات تعريف أدنى، معزولة بجمعيتك.</p>'+
          '<div class="note">رقم الهوية مُخزَّن مشفّراً ومحجوب؛ لا يظهر في القائمة. «كشف الهوية» متاح لمدير الجمعية فقط وعند الحاجة. لا تُخزَّن بيانات أفراد الأسرة تفصيلاً (عدد إجمالي فقط).</div>'+
          '<div class="panel"><table><thead><tr><th>الاسم</th><th>الجوال</th><th>الجنس</th><th>الفئة</th><th>أفراد الأسرة</th><th>الحالة</th><th>الهوية</th></tr></thead><tbody>'+
            (rows||'<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">لا يوجد مستفيدون بعد.</td></tr>')+'</tbody></table></div>'+
          '<div class="panel"><h3 style="color:#fff;margin-bottom:6px">إضافة مستفيد</h3>'+
            '<div class="grid3">'+
              '<div><label>الاسم</label><input id="b_name"></div>'+
              '<div><label>رقم الهوية (اختياري، 10 أرقام)</label><input id="b_nid" inputmode="numeric"></div>'+
              '<div><label>الجوال</label><input id="b_phone"></div>'+
              '<div><label>الجنس</label><select id="b_gender"><option value="">—</option><option>ذكر</option><option>أنثى</option></select></div>'+
              '<div><label>الفئة</label><select id="b_cat"><option value="">—</option><option>أرملة</option><option>أيتام</option><option>دخل محدود</option><option>كبار السن</option><option>ذوو إعاقة</option><option>أخرى</option></select></div>'+
              '<div><label>عدد أفراد الأسرة</label><input id="b_fam" type="number" min="0" value="0"></div>'+
            '</div>'+
            '<div style="margin-top:16px"><button class="btn" id="addbtn" onclick="addBen()">إضافة</button></div>'+
            '<div class="msg" id="msg"></div></div>';
      });
    }

    function show(type, text){ var m=document.getElementById("msg"); if(!m)return; m.className="msg "+type; m.textContent=text; }

    window.addBen = function(){
      var name=document.getElementById("b_name").value.trim();
      if(!name){ show("err","اسم المستفيد مطلوب."); return; }
      var nid=document.getElementById("b_nid").value.trim();
      if(nid && !/^\d{10}$/.test(nid)){ show("err","رقم الهوية يجب أن يكون 10 أرقام."); return; }
      var doc = { doctype:"Beneficiary", beneficiary_name:name,
        phone:document.getElementById("b_phone").value.trim(),
        gender:document.getElementById("b_gender").value,
        social_category:document.getElementById("b_cat").value,
        family_members_count:parseInt(document.getElementById("b_fam").value||"0",10) };
      if(nid) doc.national_id = nid;
      document.getElementById("addbtn").disabled=true;
      api("frappe.client.insert", {doc:doc}, true).then(function(res){
        if(res.ok && res.j.message){ render(); } else { show("err", errMsg(res)); document.getElementById("addbtn").disabled=false; }
      });
    };

    window.reveal = function(name, btn){
      btn.disabled=true;
      api("stochops_nonprofit.beneficiaries.reveal_national_id", {beneficiary:name}, true).then(function(res){
        btn.disabled=false;
        if(res.ok && res.j.message){
          var nid = res.j.message.national_id || "—";
          btn.outerHTML = '<span class="mono">'+esc(nid)+'</span>';
        } else { alert(errMsg(res)); }
      });
    };
  </script>
</body>
</html>
