{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اللجنة | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/nos-crud.css?v=3" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/design-system.css?v=2" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=3" />
  <script>
    window.NOS_CSRF = "{{ frappe.session.csrf_token or '' }}";
    window.NOS_USER = "{{ frappe.session.user }}";
    window.NOS_DETAIL = {
      doctype:"Committee", titleField:"committee_name",
      listRoute:"/nos/committees", crumbLabel:"اللجان", loginRedirect:"/nos/committees",
      statusField:"status", sectionTitle:"بيانات اللجنة",
      fields:[
        {field:"committee_name", label:"اسم اللجنة"},
        {field:"committee_type", label:"النوع"},
        {field:"coordinator", label:"المنسّق"},
        {field:"description", label:"الوصف"}
      ],
      statusActions:[
        {when:"نشطة", label:"أرشفة اللجنة", to:"مؤرشفة", variant:"warning"},
        {when:"مؤرشفة", label:"إعادة تنشيط", to:"نشطة", variant:"secondary"}
      ],
      relations:[
        {doctype:"Meeting", filterField:"committee", title:"اجتماعات اللجنة",
         columns:[
           {field:"name",label:"المرجع"},
           {field:"title",label:"العنوان"},
           {field:"meeting_date",label:"التاريخ"},
           {field:"status",label:"الحالة",badge:true}
         ],
         createRoute:"/nos/meetings", createLabel:"تسجيل اجتماع"},
        {doctype:"Decision", filterField:"committee", title:"قرارات اللجنة",
         columns:[
           {field:"name",label:"المرجع"},
           {field:"title",label:"القرار"},
           {field:"due_date",label:"الاستحقاق"},
           {field:"status",label:"الحالة",badge:true}
         ],
         createRoute:"/nos/decisions", createLabel:"تسجيل قرار"}
      ]
    };
  </script>
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=7" defer></script>
  <script src="/assets/stochops_nonprofit/nos/nos-detail.js?v=4" defer></script>
</head>
<body><div class="wrap"><div id="app"></div></div></body>
</html>
