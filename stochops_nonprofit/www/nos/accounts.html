{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إدارة الحسابات | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(1000px 500px at 85% -10%, #16233f 0%, transparent 60%); min-height:100vh; }
    a { color:var(--cyan); text-decoration:none; }
    .wrap { max-width:960px; margin:0 auto; padding:0 20px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; direction:ltr; }
    .logo .mark { width:26px; height:26px; border-radius:7px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); }
    .topbar .right { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--muted); }
    h1 { color:#fff; font-size:26px; font-weight:800; margin:26px 0 4px; }
    .muted { color:var(--muted); font-size:14px; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-top:18px; }
    .usage { display:inline-flex; align-items:center; gap:8px; background:rgba(37,99,235,.12); border:1px solid rgba(37,99,235,.35);
      color:#bfdbfe; border-radius:999px; padding:6px 14px; font-size:14px; font-weight:500; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:right; padding:12px 10px; border-bottom:1px solid var(--border); font-size:14px; }
    th { color:var(--muted); font-weight:500; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; }
    .pill.on { background:rgba(34,197,94,.14); color:var(--green); } .pill.off { background:rgba(248,113,113,.14); color:var(--red); }
    .rolepill { background:rgba(6,182,212,.12); color:var(--cyan); padding:3px 10px; border-radius:999px; font-size:12px; }
    label { display:block; font-size:13px; color:var(--text); margin:12px 0 6px; font-weight:500; }
    input, select { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px;
      padding:11px 13px; color:#fff; font-family:inherit; font-size:14px; }
    input:focus, select:focus { outline:none; border-color:var(--blue); }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .btn { background:var(--blue); color:#fff; border:none; border-radius:999px; padding:10px 20px; font-weight:700;
      font-size:14px; font-family:inherit; cursor:pointer; } .btn:hover{ background:#1d4ed8; } .btn:disabled{opacity:.6;}
    .btn-sm { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 12px;
      font-size:13px; font-family:inherit; cursor:pointer; } .btn-sm:hover{ border-color:var(--cyan); }
    .msg { margin-top:14px; padding:11px 14px; border-radius:10px; font-size:14px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .msg.ok { display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4); color:var(--green); }
    .center { text-align:center; padding:60px 0; }
    @media (max-width:640px){ .grid3{ grid-template-columns:1fr; } th:nth-child(2),td:nth-child(2){display:none;} }
  </style>
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/design-system.css?v=1" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=3" />
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=3" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/nos"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
      <div class="right">
        <a href="/nos/console">لوحة التشغيل</a>
        <span id="whoami"></span>
        <a href="/api/method/logout">خروج</a>
      </div>
    </div>

    <div id="app"></div>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    var USER = "{{ frappe.session.user }}";
    var ROLE_AR = { "Nonprofit Admin":"مدير الجمعية", "Executive Viewer":"مطّلع تنفيذي",
      "Committee Coordinator":"منسّق لجان", "Program Coordinator":"منسّق برامج" };
    var app = document.getElementById("app");
    document.getElementById("whoami").textContent = (USER && USER !== "Guest") ? USER : "";

    function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

    function api(method, args, isPost){
      var opt = { headers: { "X-Frappe-CSRF-Token": CSRF } };
      var url = "/api/method/" + method;
      if (isPost){ opt.method="POST"; opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(args||{}); }
      else if (args){ url += "?" + new URLSearchParams(args).toString(); }
      return fetch(url, opt).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
    }
    function errMsg(res){
      try { var sm=JSON.parse(res.j._server_messages||"[]"); if(sm.length) return (JSON.parse(sm[0]).message||"").replace(/<[^>]+>/g,""); } catch(e){}
      return "حدث خطأ.";
    }

    if (!USER || USER === "Guest"){
      app.innerHTML = '<div class="center"><h1>إدارة الحسابات</h1><p class="muted">يجب تسجيل الدخول كمدير الجمعية.</p><p style="margin-top:16px"><a class="btn" href="/login?redirect-to=/nos/console">تسجيل الدخول</a></p></div>';
    } else {
      render();
    }

    function render(){
      api("stochops_nonprofit.accounts.list_accounts").then(function(res){
        if (!res.ok){ app.innerHTML = '<div class="center"><h1>إدارة الحسابات</h1><p class="msg err">'+esc(errMsg(res))+'</p></div>'; return; }
        var d = res.j.message;
        var rows = d.accounts.map(function(a){
          var roles = (a.roles||[]).map(function(r){ return '<span class="rolepill">'+esc(ROLE_AR[r]||r)+'</span>'; }).join(" ");
          var st = a.enabled ? '<span class="pill on">مفعّل</span>' : '<span class="pill off">معطّل</span>';
          var act = (a.name===USER) ? '<span class="muted">—</span>'
            : '<button class="btn-sm" onclick="toggle(\''+esc(a.name)+'\','+(a.enabled?0:1)+')">'+(a.enabled?"تعطيل":"تفعيل")+'</button>';
          return '<tr><td>'+esc(a.full_name||"")+'</td><td>'+esc(a.name)+'</td><td>'+roles+'</td><td>'+st+'</td><td>'+act+'</td></tr>';
        }).join("");
        var full = d.remaining <= 0;
        app.innerHTML =
          '<h1>إدارة حسابات الجمعية</h1>'+
          '<p class="muted">'+esc(d.charity)+'</p>'+
          '<div style="margin-top:14px"><span class="usage">الحسابات: '+d.used+' من '+d.max_accounts+' &nbsp;·&nbsp; المتبقّي '+d.remaining+'</span></div>'+
          '<div class="panel"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
          '<div class="panel"><h3 style="color:#fff;margin-bottom:6px">إضافة حساب جديد</h3>'+
          (full ? '<p class="msg err" style="display:block">بلغت الحد الأقصى للحسابات.</p>' :
          '<div class="grid3">'+
            '<div><label>الاسم</label><input id="n_name"></div>'+
            '<div><label>البريد</label><input id="n_email" type="email"></div>'+
            '<div><label>الدور</label><select id="n_role">'+
              '<option value="Executive Viewer">مطّلع تنفيذي</option>'+
              '<option value="Committee Coordinator">منسّق لجان</option>'+
              '<option value="Program Coordinator">منسّق برامج</option>'+
              '<option value="Nonprofit Admin">مدير الجمعية</option>'+
            '</select></div>'+
          '</div>'+
          '<p class="muted" style="margin-top:10px;font-size:12px">يُرسَل للمدعو رابط أحادي ليضبط كلمة مروره بنفسه — لا تُرسَل كلمة مرور في البريد.</p>'+
          '<div style="margin-top:12px"><button class="btn" id="addbtn" onclick="addAccount()">إرسال دعوة</button></div>')+
          '<div class="msg" id="msg"></div></div>';
      });
    }

    function show(type, text){ var m=document.getElementById("msg"); if(!m)return; m.className="msg "+type; m.textContent=text; }

    window.addAccount = function(){
      var name=document.getElementById("n_name").value.trim();
      var email=document.getElementById("n_email").value.trim();
      var role=document.getElementById("n_role").value;
      if(!name||!email){ show("err","الاسم والبريد مطلوبان."); return; }
      document.getElementById("addbtn").disabled=true;
      api("stochops_nonprofit.accounts.invite_account", {full_name:name, email:email, role:role}, true)
        .then(function(res){
          if(res.ok && res.j.message){
            var m = res.j.message;
            if(m.invite_url){ show("ok","تم إنشاء الدعوة. رابط التفعيل (تطوير): "+m.invite_url); setTimeout(render, 2500); }
            else { show("ok","تم إرسال الدعوة إلى "+email+"."); setTimeout(render, 1500); }
          } else { show("err", errMsg(res)); document.getElementById("addbtn").disabled=false; }
        });
    };

    window.toggle = function(email, enabled){
      api("stochops_nonprofit.accounts.set_account_enabled", {email:email, enabled:enabled}, true)
        .then(function(res){ if(res.ok){ render(); } else { alert(errMsg(res)); } });
    };
  </script>
</body>
</html>
