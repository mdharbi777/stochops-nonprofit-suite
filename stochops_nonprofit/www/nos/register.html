<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل جمعية | STOCHOPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(1000px 500px at 80% -10%, #1b2a4a 0%, transparent 60%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
    a { color:var(--cyan); text-decoration:none; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; justify-content:center; margin-bottom:6px; direction:ltr; }
    .logo .mark { width:28px; height:28px; border-radius:8px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    .box { width:100%; max-width:520px; background:var(--card); border:1px solid var(--border);
      border-radius:18px; padding:30px; }
    h1 { color:#fff; font-size:24px; font-weight:800; text-align:center; margin-bottom:4px; }
    .sub { color:var(--muted); text-align:center; font-size:14px; margin-bottom:22px; }
    label { display:block; font-size:14px; color:var(--text); margin:14px 0 6px; font-weight:500; }
    .req { color:var(--cyan); }
    input { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px;
      padding:12px 14px; color:#fff; font-family:inherit; font-size:15px; }
    input:focus { outline:none; border-color:var(--blue); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .btn { width:100%; margin-top:22px; background:var(--blue); color:#fff; border:none; border-radius:999px;
      padding:13px; font-weight:700; font-size:16px; font-family:inherit; cursor:pointer; transition:.15s; }
    .btn:hover { background:#1d4ed8; } .btn:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:16px; padding:12px 14px; border-radius:10px; font-size:14px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .msg.ok { display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4); color:var(--green); }
    .foot { text-align:center; color:var(--muted); font-size:14px; margin-top:18px; }
    @media (max-width:520px){ .row{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="box">
    <a class="logo" href="/nos"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
    <h1>تسجيل جمعية جديدة</h1>
    <p class="sub">أنشئ حساب جمعيتك وأول حساب مدير — مجاناً</p>

    <form id="f" autocomplete="off">
      <label>اسم الجمعية <span class="req">*</span></label>
      <input name="charity_name" required maxlength="140" />
      <label>رقم التسجيل/الترخيص (اختياري)</label>
      <input name="registration_number" maxlength="140" />
      <label>اسم المدير <span class="req">*</span></label>
      <input name="admin_full_name" required maxlength="140" />
      <div class="row">
        <div>
          <label>البريد الإلكتروني <span class="req">*</span></label>
          <input name="admin_email" type="email" required />
        </div>
        <div>
          <label>جوال التواصل</label>
          <input name="admin_mobile" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>كلمة المرور <span class="req">*</span></label>
          <input name="password" type="password" required minlength="8" />
        </div>
        <div>
          <label>تأكيد كلمة المرور <span class="req">*</span></label>
          <input name="password2" type="password" required minlength="8" />
        </div>
      </div>
      <label>التحقّق البشري — كم ناتج <span class="req" id="cap_q">…</span>؟ <a href="javascript:void(0)" id="cap_refresh" style="font-size:12px;margin-inline-start:8px">تحديث</a></label>
      <input id="cap_ans" inputmode="numeric" autocomplete="off" required placeholder="أدخل الناتج" />
      <button class="btn" type="submit" id="submit">إنشاء الحساب</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="foot">لديك حساب؟ <a href="/login">تسجيل الدخول</a></p>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    var form = document.getElementById("f"), msg = document.getElementById("msg"), btn = document.getElementById("submit");
    var capToken = "";
    function show(type, text) { msg.className = "msg " + type; msg.innerHTML = text; }
    function stripHtml(s){ return (s||"").replace(/<[^>]+>/g,""); }

    function loadCaptcha(){
      fetch("/api/method/stochops_nonprofit.signup.get_captcha").then(function(r){return r.json();}).then(function(j){
        var m=j.message||{}; capToken=m.token||""; document.getElementById("cap_q").textContent=m.question||"";
      });
    }
    document.getElementById("cap_refresh").addEventListener("click", function(){ document.getElementById("cap_ans").value=""; loadCaptcha(); });
    loadCaptcha();

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var d = Object.fromEntries(new FormData(form).entries());
      var capAns = document.getElementById("cap_ans").value.trim();
      if (d.password !== d.password2) { show("err", "كلمتا المرور غير متطابقتين."); return; }
      if (d.password.length < 8) { show("err", "كلمة المرور يجب ألا تقل عن 8 أحرف."); return; }
      if (!capAns) { show("err", "أدخل ناتج التحقّق."); return; }
      btn.disabled = true; show("", ""); msg.className = "msg";
      fetch("/api/method/stochops_nonprofit.signup.register_charity", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": CSRF },
        body: JSON.stringify({
          charity_name: d.charity_name, admin_full_name: d.admin_full_name,
          admin_email: d.admin_email, password: d.password,
          captcha_token: capToken, captcha_answer: capAns,
          admin_mobile: d.admin_mobile || null, registration_number: d.registration_number || null
        })
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (res.ok && res.j.message) {
            var m = res.j.message;
            var html = "تم إنشاء حساب جمعيتك ✅ أرسلنا رابط تأكيد إلى بريدك — فعّله ثم <a href='/login'>سجّل الدخول</a>.";
            if (m.verify_url) { html += "<br><small>للتجربة المحلية: <a href='" + m.verify_url + "'>رابط التأكيد</a></small>"; }
            show("ok", html); form.style.display = "none";
          } else {
            var err = "تعذّر إنشاء الحساب.";
            try { var sm = JSON.parse(res.j._server_messages || "[]"); if (sm.length) err = stripHtml(JSON.parse(sm[0]).message) || err; } catch (x) {}
            show("err", err); btn.disabled = false; document.getElementById("cap_ans").value=""; loadCaptcha();
          }
        }).catch(function () { show("err", "خطأ في الاتصال، حاول مجدداً."); btn.disabled = false; });
    });
  </script>
</body>
</html>
