{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المنح | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(1000px 500px at 85% -10%, #16233f 0%, transparent 60%); min-height:100vh; }
    a { color:var(--cyan); text-decoration:none; }
    .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; direction:ltr; }
    .logo .mark { width:26px; height:26px; border-radius:7px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); }
    .topbar .right { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--muted); }
    h1 { color:#fff; font-size:26px; font-weight:800; margin:24px 0 2px; }
    .muted { color:var(--muted); font-size:14px; }
    .note { background:var(--navy2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--muted); margin:16px 0; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-top:18px; overflow-x:auto; }
    .panel h3 { color:#fff; font-size:16px; margin-bottom:6px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:right; padding:11px 10px; border-bottom:1px solid var(--border); font-size:13.5px; white-space:nowrap; }
    th { color:var(--muted); font-weight:500; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; background:rgba(148,163,184,.15); color:var(--muted); }
    .pill.ok { background:rgba(34,197,94,.14); color:var(--green); } .pill.no { background:rgba(248,113,113,.14); color:var(--red); }
    label { display:block; font-size:13px; color:var(--text); margin:12px 0 6px; font-weight:500; }
    input, select, textarea { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:#fff; font-family:inherit; font-size:14px; }
    textarea { min-height:56px; resize:vertical; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--blue); }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .btn { background:var(--blue); color:#fff; border:none; border-radius:999px; padding:10px 20px; font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; } .btn:hover{ background:#1d4ed8; } .btn:disabled{opacity:.6;}
    .msg { margin-top:14px; padding:11px 14px; border-radius:10px; font-size:14px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .center { text-align:center; padding:60px 0; }
    .num { font-variant-numeric:tabular-nums; }
    @media (max-width:720px){ .grid3{ grid-template-columns:1fr; } th,td{ white-space:normal; } }
  </style>
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=2" />
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=2" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/nos"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
      <div class="right">
        <a href="/nos/console">لوحة التشغيل</a>
        <a href="/nos/donors">المتبرعون</a>
        <span id="whoami"></span>
        <a href="/api/method/logout">خروج</a>
      </div>
    </div>
    <div id="app"></div>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    var USER = "{{ frappe.session.user }}";
    var app = document.getElementById("app");
    document.getElementById("whoami").textContent = (USER && USER!=="Guest") ? USER : "";

    function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
    function api(method, args, isPost){
      var opt = { headers: { "X-Frappe-CSRF-Token": CSRF } };
      var url = "/api/method/" + method;
      if (isPost){ opt.method="POST"; opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(args||{}); }
      else if (args){ url += "?" + new URLSearchParams(args).toString(); }
      return fetch(url, opt).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
    }
    function errMsg(res){
      try { var sm=JSON.parse(res.j._server_messages||"[]"); if(sm.length) return (JSON.parse(sm[0]).message||"").replace(/<[^>]+>/g,""); } catch(e){}
      return "حدث خطأ.";
    }
    function statusPill(s){ var c = s==="معتمدة"?"ok":(s==="مرفوضة"?"no":""); return '<span class="pill '+c+'">'+esc(s)+'</span>'; }

    if (!USER || USER==="Guest"){
      app.innerHTML = '<div class="center"><h1>المنح</h1><p class="muted">يجب تسجيل الدخول.</p><p style="margin-top:16px"><a class="btn" href="/login?redirect-to=/nos/console">تسجيل الدخول</a></p></div>';
    } else { render(); }

    function render(){
      api("frappe.client.get_list", {doctype:"Grant", fields:JSON.stringify(["name","grant_title","grantor_name","status","amount","amount_received","reporting_due"]), order_by:"creation desc", limit_page_length:0})
      .then(function(res){
        if(!res.ok){ app.innerHTML='<div class="center"><h1>المنح</h1><p class="msg err" style="display:block">'+esc(errMsg(res))+'</p></div>'; return; }
        var rows = (res.j.message||[]).map(function(g){
          return '<tr><td>'+esc(g.grant_title)+'</td><td>'+esc(g.grantor_name)+'</td><td>'+statusPill(g.status)+'</td>'+
            '<td class="num">'+(g.amount?Number(g.amount).toLocaleString("en-US"):'—')+'</td>'+
            '<td class="num">'+(g.amount_received?Number(g.amount_received).toLocaleString("en-US"):'—')+'</td>'+
            '<td>'+esc(g.reporting_due||"—")+'</td></tr>';
        }).join("");
        app.innerHTML =
          '<h1>المنح</h1>'+
          '<p class="muted">منح الجهات المانحة وشروطها ومواعيد تقاريرها، معزولة بجمعيتك.</p>'+
          '<div class="note">القيم المستلمة <b>تسجيل فقط</b> — لا حركة أموال. اربط المنحة بمبادرة لتتبّع صرفها الإداري عبر وحدة المبادرات.</div>'+
          '<div class="panel"><table><thead><tr><th>العنوان</th><th>الجهة المانحة</th><th>الحالة</th><th>القيمة</th><th>المستلم</th><th>موعد التقرير</th></tr></thead><tbody>'+
            (rows||'<tr><td colspan="6" class="muted" style="text-align:center;padding:20px">لا منح بعد.</td></tr>')+'</tbody></table></div>'+
          '<div class="panel"><h3>منحة جديدة</h3>'+
            '<div class="grid3">'+
              '<div><label>العنوان</label><input id="g_title"></div>'+
              '<div><label>الجهة المانحة</label><input id="g_grantor"></div>'+
              '<div><label>الحالة</label><select id="g_status"><option>مقترحة</option><option>مقدَّمة</option><option>معتمدة</option><option>مرفوضة</option><option>مغلقة</option></select></div>'+
              '<div><label>قيمة المنحة (ريال)</label><input id="g_amount" type="number" min="0"></div>'+
              '<div><label>المستلم (ريال)</label><input id="g_recv" type="number" min="0"></div>'+
              '<div><label>موعد التقرير</label><input id="g_due" type="date"></div>'+
            '</div>'+
            '<label>الشروط</label><textarea id="g_cond"></textarea>'+
            '<div style="margin-top:12px"><button class="btn" id="gbtn" onclick="addGrant()">إضافة المنحة</button></div>'+
            '<div class="msg" id="msg"></div></div>';
      });
    }

    function show(type, text){ var m=document.getElementById("msg"); if(!m)return; m.className="msg "+type; m.textContent=text; }

    window.addGrant = function(){
      var title=document.getElementById("g_title").value.trim();
      var grantor=document.getElementById("g_grantor").value.trim();
      if(!title||!grantor){ show("err","العنوان والجهة المانحة مطلوبان."); return; }
      var doc = { doctype:"Grant", grant_title:title, grantor_name:grantor, status:document.getElementById("g_status").value,
        amount:parseFloat(document.getElementById("g_amount").value||"0"),
        amount_received:parseFloat(document.getElementById("g_recv").value||"0"),
        reporting_due:document.getElementById("g_due").value||null,
        conditions:document.getElementById("g_cond").value.trim() };
      document.getElementById("gbtn").disabled=true;
      api("frappe.client.insert", {doc:doc}, true).then(function(res){
        if(res.ok&&res.j.message){ render(); } else { show("err",errMsg(res)); document.getElementById("gbtn").disabled=false; }
      });
    };
  </script>
</body>
</html>
