{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إعدادات الجمعية | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(1000px 500px at 85% -10%, #16233f 0%, transparent 60%); min-height:100vh; }
    a { color:var(--cyan); text-decoration:none; }
    .wrap { max-width:820px; margin:0 auto; padding:0 20px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; direction:ltr; }
    .logo .mark { width:26px; height:26px; border-radius:7px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); }
    .topbar .right { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--muted); }
    h1 { color:#fff; font-size:26px; font-weight:800; margin:24px 0 2px; }
    .muted { color:var(--muted); font-size:14px; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-top:18px; }
    .panel h3 { color:#fff; font-size:16px; margin-bottom:4px; }
    .ps { color:var(--muted); font-size:13px; margin-bottom:12px; }
    label { display:block; font-size:13px; color:var(--text); margin:14px 0 6px; font-weight:500; }
    input { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px;
      padding:11px 13px; color:#fff; font-family:inherit; font-size:14px; }
    input:focus { outline:none; border-color:var(--blue); }
    input:disabled { color:var(--muted); background:#0a1120; }
    .hint { font-size:12px; color:var(--muted); margin-top:5px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .btn { background:var(--blue); color:#fff; border:none; border-radius:999px; padding:11px 24px; font-weight:700;
      font-size:14px; font-family:inherit; cursor:pointer; margin-top:18px; } .btn:hover{ background:#1d4ed8; } .btn:disabled{opacity:.6;}
    .msg { margin-top:14px; padding:11px 14px; border-radius:10px; font-size:14px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .msg.ok { display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4); color:var(--green); }
    .kv { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .kv:last-child { border-bottom:none; } .kv .k { color:var(--muted); } .kv .v { color:#fff; font-weight:500; }
    .center { text-align:center; padding:60px 0; }
    @media (max-width:620px){ .grid2{ grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/design-system.css?v=2" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=3" />
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=7" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/nos"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
      <div class="right">
        <a href="/nos/console">لوحة التحكم</a>
        <span id="whoami"></span>
        <a href="/api/method/logout">خروج</a>
      </div>
    </div>
    <div id="app"></div>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    var USER = "{{ frappe.session.user }}";
    var app = document.getElementById("app");
    document.getElementById("whoami").textContent = (USER && USER!=="Guest") ? USER : "";

    function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
    function api(method, args, isPost){
      var opt = { headers: { "X-Frappe-CSRF-Token": CSRF } };
      var url = "/api/method/" + method;
      if (isPost){ opt.method="POST"; opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(args||{}); }
      else if (args){ url += "?" + new URLSearchParams(args).toString(); }
      return fetch(url, opt).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
    }
    function errMsg(res){
      try { var sm=JSON.parse(res.j._server_messages||"[]"); if(sm.length) return (JSON.parse(sm[0]).message||"").replace(/<[^>]+>/g,""); } catch(e){}
      return "حدث خطأ.";
    }

    if (!USER || USER==="Guest"){
      app.innerHTML = '<div class="center"><h1>إعدادات الجمعية</h1><p class="muted">يجب تسجيل الدخول كمدير الجمعية.</p><p style="margin-top:16px"><a class="btn" href="/login?redirect-to=/nos/console">تسجيل الدخول</a></p></div>';
    } else { load(); }

    function load(){
      api("stochops_nonprofit.accounts.get_charity_settings").then(function(res){
        if (!res.ok){ app.innerHTML = '<div class="center"><h1>إعدادات الجمعية</h1><p class="msg err" style="display:block">'+esc(errMsg(res))+'</p></div>'; return; }
        var d = res.j.message || {};
        var statusAr = d.status==="Suspended" ? "موقوفة" : "نشطة";
        app.innerHTML =
          '<h1>إعدادات الجمعية</h1>'+
          '<p class="muted">هوية الجمعية وبيانات التواصل — يراها ويعدّلها مدير الجمعية فقط.</p>'+

          '<div class="panel">'+
            '<h3>الهوية (تُدار من منصّة STOCHOPS)</h3>'+
            '<p class="ps">هذه الحقول ثابتة لضمان اتساق العزل بين الجمعيات. لتغييرها تواصل مع STOCHOPS.</p>'+
            '<div class="kv"><span class="k">اسم الجمعية</span><span class="v">'+esc(d.charity_name||"—")+'</span></div>'+
            '<div class="kv"><span class="k">الحالة</span><span class="v">'+esc(statusAr)+'</span></div>'+
            '<div class="kv"><span class="k">حد الحسابات</span><span class="v">'+esc(String(d.max_accounts||5))+' ('+esc(String(d.used||0))+' مستخدم)</span></div>'+
          '</div>'+

          '<div class="panel">'+
            '<h3>بيانات قابلة للتعديل</h3>'+
            '<p class="ps">تظهر في التقارير والمراسلات الرسمية للجمعية.</p>'+
            '<label>رقم التسجيل/الترخيص</label>'+
            '<input id="reg" value="'+esc(d.registration_number||"")+'">'+
            '<div class="grid2">'+
              '<div><label>البريد الرسمي</label><input id="email" type="email" value="'+esc(d.contact_email||"")+'"></div>'+
              '<div><label>جوال التواصل</label><input id="mobile" value="'+esc(d.contact_mobile||"")+'"></div>'+
            '</div>'+
            '<label>حدّ اعتماد الصرف لمدير الجمعية (ريال)</label>'+
            '<input id="exp_limit" type="number" min="0" value="'+esc(String(d.expense_approval_limit||0))+'">'+
            '<div class="hint">أعلى مبلغ طلب صرف يعتمده مدير الجمعية؛ ما يتجاوزه يتطلّب تصعيداً لمشغّل المنصّة (حوكمة مالية).</div>'+
            '<button class="btn" id="savebtn" onclick="save()">حفظ التغييرات</button>'+
            '<div class="msg" id="msg"></div>'+
          '</div>';
      });
    }

    function show(type, text){ var m=document.getElementById("msg"); if(!m)return; m.className="msg "+type; m.textContent=text; }

    window.save = function(){
      var reg=document.getElementById("reg").value.trim();
      var email=document.getElementById("email").value.trim();
      var mobile=document.getElementById("mobile").value.trim();
      var lim=document.getElementById("exp_limit").value;
      document.getElementById("savebtn").disabled=true;
      api("stochops_nonprofit.accounts.update_charity_settings",
          {registration_number:reg, contact_email:email, contact_mobile:mobile, expense_approval_limit:lim}, true)
        .then(function(res){
          document.getElementById("savebtn").disabled=false;
          if (res.ok && res.j.message){ show("ok","تم حفظ التغييرات."); }
          else { show("err", errMsg(res)); }
        });
    };
  </script>
</body>
</html>
