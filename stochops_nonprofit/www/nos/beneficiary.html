{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المستفيد | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/nos-crud.css?v=1" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/design-system.css?v=1" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=3" />
  <script>
    window.NOS_CSRF = "{{ frappe.session.csrf_token or '' }}";
    window.NOS_USER = "{{ frappe.session.user }}";
    window.NOS_DETAIL = {
      doctype:"Beneficiary", titleField:"beneficiary_name",
      listRoute:"/nos/beneficiaries", crumbLabel:"المستفيدون", loginRedirect:"/nos/beneficiaries",
      statusField:"status", sectionTitle:"بيانات المستفيد",
      fields:[
        {field:"beneficiary_name", label:"الاسم"},
        {field:"phone", label:"الجوال"},
        {field:"gender", label:"الجنس"},
        {field:"social_category", label:"الفئة"},
        {field:"family_members_count", label:"عدد أفراد الأسرة"},
        {field:"case_worker", label:"مسؤول الحالة"},
        {field:"national_id", label:"رقم الهوية", reveal:"stochops_nonprofit.beneficiaries.reveal_national_id", revealArg:"beneficiary"}
      ],
      statusActions:[
        {when:"نشط", label:"أرشفة المستفيد", to:"مؤرشف", variant:"warning"},
        {when:"مؤرشف", label:"إعادة تنشيط", to:"نشط", variant:"secondary"}
      ],
      relations:[
        {doctype:"Assistance Request", filterField:"beneficiary", title:"طلبات المساعدة المرتبطة",
         columns:[
           {field:"name",label:"المرجع"},
           {field:"request_type",label:"النوع"},
           {field:"amount",label:"المبلغ",money:true},
           {field:"priority",label:"الأولوية"},
           {field:"status",label:"الحالة",badge:true}
         ],
         createRoute:"/nos/assistance", createLabel:"إنشاء طلب مساعدة"}
      ]
    };
  </script>
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=4" defer></script>
  <script src="/assets/stochops_nonprofit/nos/nos-detail.js?v=3" defer></script>
</head>
<body><div class="wrap"><div id="app"></div></div></body>
</html>
