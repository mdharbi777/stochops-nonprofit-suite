{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>حقوق الأفراد والموافقات | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; --amber:#fbbf24; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(1000px 500px at 85% -10%, #16233f 0%, transparent 60%); min-height:100vh; }
    a { color:var(--cyan); text-decoration:none; }
    .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; direction:ltr; }
    .logo .mark { width:26px; height:26px; border-radius:7px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); }
    .topbar .right { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--muted); }
    h1 { color:#fff; font-size:26px; font-weight:800; margin:24px 0 2px; }
    .muted { color:var(--muted); font-size:14px; }
    .note { background:var(--navy2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--muted); margin:16px 0; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-top:18px; overflow-x:auto; }
    .panel h3 { color:#fff; font-size:16px; margin-bottom:6px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:right; padding:10px; border-bottom:1px solid var(--border); font-size:13px; white-space:nowrap; }
    th { color:var(--muted); font-weight:500; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; background:rgba(148,163,184,.15); color:var(--muted); }
    .pill.od { background:rgba(248,113,113,.14); color:var(--red); }
    label { display:block; font-size:13px; color:var(--text); margin:10px 0 6px; font-weight:500; }
    input, select { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:#fff; font-family:inherit; font-size:14px; }
    input:focus, select:focus { outline:none; border-color:var(--blue); }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .btn { background:var(--blue); color:#fff; border:none; border-radius:999px; padding:10px 20px; font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; } .btn:hover{ background:#1d4ed8; } .btn:disabled{opacity:.6;}
    .msg { margin-top:12px; padding:10px 13px; border-radius:10px; font-size:13.5px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .center { text-align:center; padding:60px 0; }
    @media (max-width:720px){ .grid3{ grid-template-columns:1fr; } th,td{ white-space:normal; } }
  </style>
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/design-system.css?v=2" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=3" />
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=6" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/nos"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
      <div class="right"><a href="/nos/console">لوحة التحكم</a><a href="/nos/privacy">الخصوصية</a><span id="whoami"></span><a href="/api/method/logout">خروج</a></div>
    </div>
    <div id="app"></div>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    var USER = "{{ frappe.session.user }}";
    var TODAY = "{{ frappe.utils.today() }}";
    var app = document.getElementById("app");
    document.getElementById("whoami").textContent = (USER && USER!=="Guest") ? USER : "";

    function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
    function today(){ var t=new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
    function api(method, args, isPost){
      var opt = { headers: { "X-Frappe-CSRF-Token": CSRF } };
      var url = "/api/method/" + method;
      if (isPost){ opt.method="POST"; opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(args||{}); }
      else if (args){ url += "?" + new URLSearchParams(args).toString(); }
      return fetch(url, opt).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
    }
    function errMsg(res){
      try { var sm=JSON.parse(res.j._server_messages||"[]"); if(sm.length) return (JSON.parse(sm[0]).message||"").replace(/<[^>]+>/g,""); } catch(e){}
      return "حدث خطأ.";
    }
    var RCLOSED=["مكتمل","مرفوض جزئياً","مرفوض"];

    if (!USER || USER==="Guest"){
      app.innerHTML = '<div class="center"><h1>حقوق الأفراد</h1><p class="muted">يجب تسجيل الدخول كمدير الجمعية.</p><p style="margin-top:16px"><a class="btn" href="/login?redirect-to=/nos/console">تسجيل الدخول</a></p></div>';
    } else { render(); }

    function render(){
      Promise.all([
        api("frappe.client.get_list", {doctype:"Privacy Rights Request", fields:JSON.stringify(["name","request_type","subject_name","received_on","due_date","extended_due","status"]), order_by:"creation desc", limit_page_length:0}),
        api("frappe.client.get_list", {doctype:"Consent Record", fields:JSON.stringify(["name","subject_type","subject_ref","purpose","status"]), order_by:"creation desc", limit_page_length:0}),
        api("frappe.client.get_list", {doctype:"Privacy Impact Assessment", fields:JSON.stringify(["name","activity_name","residual_risk","decision","status"]), order_by:"creation desc", limit_page_length:0})
      ]).then(function(r){
        if(!r[0].ok){ app.innerHTML='<div class="center"><h1>حقوق الأفراد</h1><p class="msg err" style="display:block">'+esc(errMsg(r[0]))+'</p></div>'; return; }
        var rights=(r[0].j.message||[]).map(function(x){
          var due=x.extended_due||x.due_date;
          var od = due && due<TODAY && RCLOSED.indexOf(x.status)<0;
          return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.request_type)+'</td><td>'+esc(x.subject_name||"—")+'</td><td>'+esc(x.received_on||"")+'</td><td>'+esc(due||"—")+(od?' <span class="pill od">متأخر</span>':'')+'</td><td>'+esc(x.status)+'</td></tr>';
        }).join("");
        var cons=(r[1].ok?r[1].j.message:[]||[]).map(function(c){
          return '<tr><td>'+esc(c.subject_type)+'</td><td>'+esc(c.subject_ref||"—")+'</td><td>'+esc(c.purpose||"—")+'</td><td>'+esc(c.status)+'</td></tr>';
        }).join("");
        var dpia=(r[2].ok?r[2].j.message:[]||[]).map(function(d){
          return '<tr><td>'+esc(d.activity_name)+'</td><td>'+esc(d.residual_risk||"")+'</td><td>'+esc(d.decision||"")+'</td><td>'+esc(d.status)+'</td></tr>';
        }).join("");
        app.innerHTML =
          '<h1>حقوق الأفراد والموافقات</h1>'+
          '<p class="muted">طلبات حقوق أصحاب البيانات وسجلّات الموافقة وتقييمات الأثر — معزولة بجمعيتك.</p>'+
          '<div class="note">تُعالَج طلبات الحقوق خلال 30 يوماً (تمديد 30 بمبرر). لا رد آلي — المعالجة بشرية بإشراف مسؤول الخصوصية.</div>'+
          '<div class="panel"><h3>طلبات حقوق أصحاب البيانات</h3><table><thead><tr><th>الطلب</th><th>النوع</th><th>صاحب الطلب</th><th>الاستلام</th><th>الاستحقاق</th><th>الحالة</th></tr></thead><tbody>'+
            (rights||'<tr><td colspan="6" class="muted" style="text-align:center;padding:16px">لا طلبات.</td></tr>')+'</tbody></table>'+
            '<div class="grid3" style="margin-top:12px">'+
              '<div><label>النوع</label><select id="r_type"><option>علم</option><option>وصول</option><option>حصول على نسخة</option><option>تصحيح</option><option>حذف/إتلاف</option><option>سحب موافقة</option><option>اعتراض</option><option>شكوى</option></select></div>'+
              '<div><label>اسم صاحب الطلب</label><input id="r_name"></div>'+
              '<div><label>تاريخ الاستلام</label><input id="r_date" type="date" value="'+today()+'"></div>'+
            '</div><div style="margin-top:10px"><button class="btn" id="rbtn" onclick="addRight()">تسجيل طلب حق</button></div><div class="msg" id="rmsg"></div></div>'+
          '<div class="panel"><h3>سجلّات الموافقة</h3><table><thead><tr><th>النوع</th><th>المرجع</th><th>الغرض</th><th>الحالة</th></tr></thead><tbody>'+
            (cons||'<tr><td colspan="4" class="muted" style="text-align:center;padding:16px">لا سجلّات.</td></tr>')+'</tbody></table>'+
            '<div class="grid3" style="margin-top:12px">'+
              '<div><label>نوع صاحب البيانات</label><select id="c_type"><option>مستفيد</option><option>متبرع</option><option>موظف</option><option>آخر</option></select></div>'+
              '<div><label>المرجع</label><input id="c_ref"></div>'+
              '<div><label>الغرض</label><input id="c_purpose"></div>'+
            '</div><div style="margin-top:10px"><button class="btn" id="cbtn" onclick="addConsent()">تسجيل موافقة</button></div><div class="msg" id="cmsg"></div></div>'+
          '<div class="panel"><h3>تقييمات الأثر (DPIA)</h3><table><thead><tr><th>النشاط</th><th>الخطر المتبقي</th><th>القرار</th><th>الحالة</th></tr></thead><tbody>'+
            (dpia||'<tr><td colspan="4" class="muted" style="text-align:center;padding:16px">لا تقييمات.</td></tr>')+'</tbody></table>'+
            '<p class="muted" style="margin-top:10px;font-size:12px">يُنشأ تقييم الأثر ويُعتمد بقرار بشري من المخوّل قبل تشغيل الأنشطة عالية المخاطر.</p></div>';
      });
    }

    function show(id,type,text){ var m=document.getElementById(id); if(!m)return; m.className="msg "+type; m.textContent=text; }

    window.addRight = function(){
      var name=document.getElementById("r_name").value.trim();
      var date=document.getElementById("r_date").value;
      if(!date){ show("rmsg","err","تاريخ الاستلام مطلوب."); return; }
      document.getElementById("rbtn").disabled=true;
      api("frappe.client.insert", {doc:{doctype:"Privacy Rights Request", request_type:document.getElementById("r_type").value, subject_name:name, received_on:date, status:"مستلم"}}, true)
        .then(function(res){ if(res.ok&&res.j.message){ render(); } else { show("rmsg","err",errMsg(res)); document.getElementById("rbtn").disabled=false; } });
    };

    window.addConsent = function(){
      var ref=document.getElementById("c_ref").value.trim();
      if(!ref){ show("cmsg","err","المرجع مطلوب."); return; }
      document.getElementById("cbtn").disabled=true;
      api("frappe.client.insert", {doc:{doctype:"Consent Record", subject_type:document.getElementById("c_type").value, subject_ref:ref, purpose:document.getElementById("c_purpose").value.trim(), status:"ممنوحة", granted_on:today()}}, true)
        .then(function(res){ if(res.ok&&res.j.message){ render(); } else { show("cmsg","err",errMsg(res)); document.getElementById("cbtn").disabled=false; } });
    };
  </script>
</body>
</html>
