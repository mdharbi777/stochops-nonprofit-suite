<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>طلبات المساعدة | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; --amber:#fbbf24; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(1000px 500px at 85% -10%, #16233f 0%, transparent 60%); min-height:100vh; }
    a { color:var(--cyan); text-decoration:none; }
    .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; direction:ltr; }
    .logo .mark { width:26px; height:26px; border-radius:7px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); }
    .topbar .right { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--muted); }
    h1 { color:#fff; font-size:26px; font-weight:800; margin:24px 0 2px; }
    .muted { color:var(--muted); font-size:14px; }
    .note { background:var(--navy2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--muted); margin:16px 0; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-top:18px; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:right; padding:11px 10px; border-bottom:1px solid var(--border); font-size:13.5px; white-space:nowrap; }
    th { color:var(--muted); font-weight:500; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; }
    .s-مقدم,.s-قيد { background:rgba(148,163,184,.15); color:var(--muted); }
    .s-معتمد,.s-مصروف { background:rgba(34,197,94,.14); color:var(--green); }
    .s-مرفوض,.s-ملغى { background:rgba(248,113,113,.14); color:var(--red); }
    label { display:block; font-size:13px; color:var(--text); margin:12px 0 6px; font-weight:500; }
    input, select, textarea { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:#fff; font-family:inherit; font-size:14px; }
    textarea { min-height:60px; resize:vertical; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--blue); }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .btn { background:var(--blue); color:#fff; border:none; border-radius:999px; padding:10px 20px; font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; } .btn:hover{ background:#1d4ed8; } .btn:disabled{opacity:.6;}
    .btn-sm { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 9px; font-size:12.5px; font-family:inherit; cursor:pointer; } .btn-sm:hover{ border-color:var(--cyan); }
    .msg { margin-top:14px; padding:11px 14px; border-radius:10px; font-size:14px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .msg.ok { display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4); color:var(--green); }
    .center { text-align:center; padding:60px 0; }
    .num { font-variant-numeric:tabular-nums; }
    @media (max-width:720px){ .grid3{ grid-template-columns:1fr; } th,td{ white-space:normal; } }
  </style>
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css" />
  <script src="/assets/stochops_nonprofit/nos/shell.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/nos"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
      <div class="right">
        <a href="/nos/console">لوحة التشغيل</a>
        <a href="/nos/beneficiaries">المستفيدون</a>
        <span id="whoami"></span>
        <a href="/api/method/logout">خروج</a>
      </div>
    </div>
    <div id="app"></div>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    var USER = "{{ frappe.session.user }}";
    var app = document.getElementById("app");
    document.getElementById("whoami").textContent = (USER && USER!=="Guest") ? USER : "";
    var BENS = [];

    function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
    function api(method, args, isPost){
      var opt = { headers: { "X-Frappe-CSRF-Token": CSRF } };
      var url = "/api/method/" + method;
      if (isPost){ opt.method="POST"; opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(args||{}); }
      else if (args){ url += "?" + new URLSearchParams(args).toString(); }
      return fetch(url, opt).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
    }
    function errMsg(res){
      try { var sm=JSON.parse(res.j._server_messages||"[]"); if(sm.length) return (JSON.parse(sm[0]).message||"").replace(/<[^>]+>/g,""); } catch(e){}
      return "حدث خطأ.";
    }
    function pill(st){ var k=(st||"").replace(/ .*/,""); return '<span class="pill s-'+esc(k)+'">'+esc(st)+'</span>'; }

    if (!USER || USER==="Guest"){
      app.innerHTML = '<div class="center"><h1>طلبات المساعدة</h1><p class="muted">يجب تسجيل الدخول.</p><p style="margin-top:16px"><a class="btn" href="/login?redirect-to=/nos/console">تسجيل الدخول</a></p></div>';
    } else { loadBens().then(render); }

    function loadBens(){
      return api("frappe.client.get_list", {doctype:"Beneficiary", fields:JSON.stringify(["name","beneficiary_name"]), filters:JSON.stringify({status:"نشط"}), limit_page_length:0})
        .then(function(res){ BENS = (res.ok && res.j.message) ? res.j.message : []; });
    }

    function render(){
      var args = { doctype:"Assistance Request",
        fields:JSON.stringify(["name","beneficiary","request_type","amount","priority","status","decision_note"]),
        order_by:"creation desc", limit_page_length:0 };
      api("frappe.client.get_list", args).then(function(res){
        if (!res.ok){ app.innerHTML = '<div class="center"><h1>طلبات المساعدة</h1><p class="msg err" style="display:block">'+esc(errMsg(res))+'</p></div>'; return; }
        var rows = (res.j.message||[]).map(function(r){
          var sel = ['مقدم','قيد المراجعة','معتمد','مرفوض','مصروف','ملغى'].map(function(s){
            return '<option'+(s===r.status?' selected':'')+'>'+esc(s)+'</option>'; }).join("");
          return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.beneficiary)+'</td><td>'+esc(r.request_type)+'</td>'+
            '<td class="num">'+(r.amount?Number(r.amount).toLocaleString("en-US"):'—')+'</td>'+
            '<td>'+esc(r.priority||"")+'</td><td>'+pill(r.status)+'</td>'+
            '<td><select class="st" data-name="'+esc(r.name)+'" onchange="chg(this)">'+sel+'</select></td></tr>';
        }).join("");
        var benOpts = BENS.map(function(b){ return '<option value="'+esc(b.name)+'">'+esc(b.beneficiary_name)+'</option>'; }).join("");
        app.innerHTML =
          '<h1>طلبات المساعدة</h1>'+
          '<p class="muted">طلبات المستفيدين ومسار اعتمادها، معزولة بجمعيتك.</p>'+
          '<div class="note">«المبلغ» تسجيل فقط — لا صرف ولا تحويل مالي. الاعتماد/الرفض يتطلّب ملاحظة قرار وصلاحية مدير الجمعية، ويُسجَّل من بتّ ومتى.</div>'+
          (BENS.length ? '' : '<div class="msg err" style="display:block">أضِف مستفيداً أولاً من صفحة «المستفيدون».</div>')+
          '<div class="panel"><table><thead><tr><th>الطلب</th><th>المستفيد</th><th>النوع</th><th>المبلغ</th><th>الأولوية</th><th>الحالة</th><th>تغيير الحالة</th></tr></thead><tbody>'+
            (rows||'<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">لا توجد طلبات بعد.</td></tr>')+'</tbody></table></div>'+
          (BENS.length ? '<div class="panel"><h3 style="color:#fff;margin-bottom:6px">طلب جديد</h3>'+
            '<div class="grid3">'+
              '<div><label>المستفيد</label><select id="a_ben">'+benOpts+'</select></div>'+
              '<div><label>النوع</label><select id="a_type"><option>مالية</option><option>عينية</option><option>خدمية</option><option>أخرى</option></select></div>'+
              '<div><label>المبلغ المطلوب (ريال)</label><input id="a_amount" type="number" min="0"></div>'+
              '<div><label>الأولوية</label><select id="a_pri"><option>عادية</option><option>عالية</option></select></div>'+
            '</div>'+
            '<label>وصف الطلب</label><textarea id="a_desc"></textarea>'+
            '<div style="margin-top:14px"><button class="btn" id="addbtn" onclick="addReq()">إنشاء الطلب</button></div>'+
            '<div class="msg" id="msg"></div></div>' : '');
      });
    }

    function show(type, text){ var m=document.getElementById("msg"); if(!m)return; m.className="msg "+type; m.textContent=text; }

    window.addReq = function(){
      var ben=document.getElementById("a_ben").value;
      if(!ben){ show("err","اختر المستفيد."); return; }
      var doc = { doctype:"Assistance Request", beneficiary:ben,
        request_type:document.getElementById("a_type").value,
        amount:parseFloat(document.getElementById("a_amount").value||"0"),
        priority:document.getElementById("a_pri").value,
        description:document.getElementById("a_desc").value.trim() };
      document.getElementById("addbtn").disabled=true;
      api("frappe.client.insert", {doc:doc}, true).then(function(res){
        if(res.ok && res.j.message){ render(); } else { show("err", errMsg(res)); document.getElementById("addbtn").disabled=false; }
      });
    };

    window.chg = function(sel){
      var name=sel.getAttribute("data-name"), status=sel.value;
      var fields={status:status};
      if(status==="معتمد"||status==="مرفوض"){
        var note=prompt("ملاحظة القرار ("+status+") — مطلوبة:");
        if(!note){ render(); return; }
        fields.decision_note=note;
      }
      api("frappe.client.set_value", {doctype:"Assistance Request", name:name, fieldname:fields}, true).then(function(res){
        if(res.ok){ render(); } else { alert(errMsg(res)); render(); }
      });
    };
  </script>
</body>
</html>
