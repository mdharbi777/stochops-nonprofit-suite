{%- set no_cache = 1 -%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الحوادث والاحتفاظ | منصة الفاضل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1220; --navy2:#101b2b; --blue:#2563eb; --cyan:#06b6d4; --text:#e2e8f0;
      --muted:#94a3b8; --card:#111a2e; --border:#1e293b; --green:#22c55e; --red:#f87171; --amber:#fbbf24; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Tajawal",sans-serif; color:var(--text); background:var(--navy);
      background-image: radial-gradient(1000px 500px at 85% -10%, #16233f 0%, transparent 60%); min-height:100vh; }
    a { color:var(--cyan); text-decoration:none; }
    .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; direction:ltr; }
    .logo .mark { width:26px; height:26px; border-radius:7px; background:var(--navy2);
      display:inline-grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:5px; align-items:end; }
    .logo .mark i { display:block; background:var(--blue); border-radius:1px; }
    .logo .mark i:nth-child(2){ background:var(--cyan); height:70%; } .logo .mark i:nth-child(1){ height:45%; } .logo .mark i:nth-child(3){ height:100%; }
    .logo b { color:#fff; } .logo span { color:var(--cyan); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); }
    .topbar .right { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--muted); }
    h1 { color:#fff; font-size:26px; font-weight:800; margin:24px 0 2px; }
    .muted { color:var(--muted); font-size:14px; }
    .note { background:var(--navy2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--muted); margin:16px 0; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-top:18px; overflow-x:auto; }
    .panel h3 { color:#fff; font-size:16px; margin-bottom:6px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:right; padding:10px; border-bottom:1px solid var(--border); font-size:13px; white-space:nowrap; }
    th { color:var(--muted); font-weight:500; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; background:rgba(148,163,184,.15); color:var(--muted); }
    .pill.on { background:rgba(34,197,94,.14); color:var(--green); } .pill.rev { background:rgba(251,191,36,.15); color:var(--amber); }
    label { display:block; font-size:13px; color:var(--text); margin:10px 0 6px; font-weight:500; }
    input, select, textarea { width:100%; background:#0c1424; border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:#fff; font-family:inherit; font-size:14px; }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .btn { background:var(--blue); color:#fff; border:none; border-radius:999px; padding:10px 20px; font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; } .btn:hover{ background:#1d4ed8; } .btn:disabled{opacity:.6;}
    .msg { margin-top:12px; padding:10px 13px; border-radius:10px; font-size:13.5px; display:none; }
    .msg.err { display:block; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--red); }
    .center { text-align:center; padding:60px 0; }
    @media (max-width:720px){ .grid3{ grid-template-columns:1fr; } th,td{ white-space:normal; } }
  </style>
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/design-system.css?v=1" />
  <link rel="stylesheet" href="/assets/stochops_nonprofit/nos/shell.css?v=3" />
  <script src="/assets/stochops_nonprofit/nos/shell.js?v=4" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/nos"><span class="mark"><i></i><i></i><i></i></span> <b>Stoch</b><span>ops</span></a>
      <div class="right"><a href="/nos/console">لوحة التشغيل</a><a href="/nos/privacy">الخصوصية</a><span id="whoami"></span><a href="/api/method/logout">خروج</a></div>
    </div>
    <div id="app"></div>
  </div>

  <script>
    var CSRF = "{{ frappe.session.csrf_token or '' }}";
    var USER = "{{ frappe.session.user }}";
    var app = document.getElementById("app");
    document.getElementById("whoami").textContent = (USER && USER!=="Guest") ? USER : "";

    function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
    function nowLocal(){ var t=new Date(); t.setMinutes(t.getMinutes()-t.getTimezoneOffset()); return t.toISOString().slice(0,16); }
    function api(method, args, isPost){
      var opt = { headers: { "X-Frappe-CSRF-Token": CSRF } };
      var url = "/api/method/" + method;
      if (isPost){ opt.method="POST"; opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(args||{}); }
      else if (args){ url += "?" + new URLSearchParams(args).toString(); }
      return fetch(url, opt).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
    }
    function errMsg(res){
      try { var sm=JSON.parse(res.j._server_messages||"[]"); if(sm.length) return (JSON.parse(sm[0]).message||"").replace(/<[^>]+>/g,""); } catch(e){}
      return "حدث خطأ.";
    }

    if (!USER || USER==="Guest"){
      app.innerHTML = '<div class="center"><h1>الحوادث والاحتفاظ</h1><p class="muted">يجب تسجيل الدخول كمدير الجمعية.</p><p style="margin-top:16px"><a class="btn" href="/login?redirect-to=/nos/console">تسجيل الدخول</a></p></div>';
    } else { render(); }

    function render(){
      Promise.all([
        api("frappe.client.get_list", {doctype:"Security Incident", fields:JSON.stringify(["name","title","incident_type","discovered_on","notice_window_deadline","requires_authority_notice","status"]), order_by:"creation desc", limit_page_length:0}),
        api("frappe.client.get_list", {doctype:"Legal Hold", fields:JSON.stringify(["name","hold_title","reference_doctype","reference_name","status"]), order_by:"creation desc", limit_page_length:0}),
        api("frappe.client.get_list", {doctype:"Retention Schedule", fields:JSON.stringify(["name","retention_period","status"]), order_by:"name asc", limit_page_length:0}),
        api("frappe.client.get_list", {doctype:"Subprocessor Register", fields:JSON.stringify(["name","service","country","status"]), order_by:"name asc", limit_page_length:0})
      ]).then(function(r){
        if(!r[0].ok){ app.innerHTML='<div class="center"><h1>الحوادث</h1><p class="msg err" style="display:block">'+esc(errMsg(r[0]))+'</p></div>'; return; }
        var inc=(r[0].j.message||[]).map(function(x){
          var an = x.requires_authority_notice ? ' <span class="pill rev">يستوجب إشعاراً</span>' : '';
          return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.incident_type||"")+'</td><td>'+esc(x.discovered_on||"")+'</td><td>'+esc(x.notice_window_deadline||"—")+an+'</td><td>'+esc(x.status)+'</td></tr>';
        }).join("");
        var holds=(r[1].ok?r[1].j.message:[]||[]).map(function(h){
          var st=h.status==="نشط"?'<span class="pill on">نشط</span>':'<span class="pill">مرفوع</span>';
          return '<tr><td>'+esc(h.hold_title)+'</td><td>'+esc((h.reference_doctype||"")+" "+(h.reference_name||""))+'</td><td>'+st+'</td></tr>';
        }).join("");
        var ret=(r[2].ok?r[2].j.message:[]||[]).map(function(x){
          var st=x.status==="APPROVED"?'<span class="pill on">معتمد</span>':'<span class="pill rev">بانتظار التحديد</span>';
          return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.retention_period||"—")+'</td><td>'+st+'</td></tr>';
        }).join("");
        var sub=(r[3].ok?r[3].j.message:[]||[]).map(function(x){
          return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.service||"")+'</td><td>'+esc(x.country||"—")+'</td><td>'+esc(x.status||"")+'</td></tr>';
        }).join("");
        app.innerHTML =
          '<h1>الحوادث والاحتفاظ والمزوّدون</h1>'+
          '<p class="muted">أمن المعلومات والخصوصية التشغيلي — معزول بجمعيتك.</p>'+
          '<div class="note">الحادثة تحسب نافذة 72 ساعة من وقت العلم كتذكير فقط — <b>لا بلاغ حكومي آلي</b>؛ قرار الإشعار بشري. الحجز القانوني يمنع الإتلاف أثناء النزاع. مدد الاحتفاظ يحدّدها المختص (لا تُخترع).</div>'+
          '<div class="panel"><h3>الحوادث</h3><table><thead><tr><th>الحادثة</th><th>العنوان</th><th>النوع</th><th>وقت العلم</th><th>نهاية نافذة 72س</th><th>الحالة</th></tr></thead><tbody>'+
            (inc||'<tr><td colspan="6" class="muted" style="text-align:center;padding:16px">لا حوادث.</td></tr>')+'</tbody></table>'+
            '<div class="grid3" style="margin-top:12px">'+
              '<div><label>العنوان</label><input id="i_title"></div>'+
              '<div><label>النوع</label><select id="i_type"><option>بريد خاطئ</option><option>كشف ملف عبر رابط</option><option>تصدير غير مخوّل</option><option>token مكشوف</option><option>اختراق حساب</option><option>إرسال AI غير مصرّح</option><option>أخرى</option></select></div>'+
              '<div><label>وقت العلم</label><input id="i_when" type="datetime-local" value="'+nowLocal()+'"></div>'+
            '</div><div style="margin-top:10px"><button class="btn" id="ibtn" onclick="addInc()">بلاغ حادثة</button></div><div class="msg" id="imsg"></div></div>'+
          '<div class="panel"><h3>الحجز القانوني</h3><table><thead><tr><th>العنوان</th><th>الهدف</th><th>الحالة</th></tr></thead><tbody>'+
            (holds||'<tr><td colspan="3" class="muted" style="text-align:center;padding:16px">لا حجوزات.</td></tr>')+'</tbody></table>'+
            '<div class="grid3" style="margin-top:12px">'+
              '<div><label>العنوان</label><input id="h_title"></div>'+
              '<div><label>السبب</label><input id="h_reason"></div>'+
              '<div><label>السجل المستهدف (اختياري)</label><input id="h_ref" placeholder="DocType اسم السجل"></div>'+
            '</div><div style="margin-top:10px"><button class="btn" id="hbtn" onclick="addHold()">وضع حجز</button></div><div class="msg" id="hmsg"></div></div>'+
          '<div class="panel"><h3>جداول الاحتفاظ (مرجع منصّة)</h3><table><thead><tr><th>الفئة</th><th>المدة</th><th>الحالة</th></tr></thead><tbody>'+
            (ret||'<tr><td colspan="3" class="muted" style="text-align:center;padding:16px">—</td></tr>')+'</tbody></table></div>'+
          '<div class="panel"><h3>المعالجون من الباطن</h3><table><thead><tr><th>المزوّد</th><th>الخدمة</th><th>الدولة</th><th>الحالة</th></tr></thead><tbody>'+
            (sub||'<tr><td colspan="4" class="muted" style="text-align:center;padding:16px">—</td></tr>')+'</tbody></table></div>';
      });
    }

    function show(id,type,text){ var m=document.getElementById(id); if(!m)return; m.className="msg "+type; m.textContent=text; }

    window.addInc = function(){
      var t=document.getElementById("i_title").value.trim(); var w=document.getElementById("i_when").value;
      if(!t||!w){ show("imsg","err","العنوان ووقت العلم مطلوبان."); return; }
      document.getElementById("ibtn").disabled=true;
      api("frappe.client.insert", {doc:{doctype:"Security Incident", title:t, incident_type:document.getElementById("i_type").value, discovered_on:w.replace("T"," ")+":00", status:"مفتوح"}}, true)
        .then(function(res){ if(res.ok&&res.j.message){ render(); } else { show("imsg","err",errMsg(res)); document.getElementById("ibtn").disabled=false; } });
    };

    window.addHold = function(){
      var t=document.getElementById("h_title").value.trim(), reason=document.getElementById("h_reason").value.trim();
      if(!t||!reason){ show("hmsg","err","العنوان والسبب مطلوبان."); return; }
      var ref=(document.getElementById("h_ref").value||"").trim().split(/\s+/);
      document.getElementById("hbtn").disabled=true;
      api("frappe.client.insert", {doc:{doctype:"Legal Hold", hold_title:t, reason:reason, reference_doctype:ref[0]||null, reference_name:ref[1]||null, status:"نشط"}}, true)
        .then(function(res){ if(res.ok&&res.j.message){ render(); } else { show("hmsg","err",errMsg(res)); document.getElementById("hbtn").disabled=false; } });
    };
  </script>
</body>
</html>
